# ==============================================================================
# SINGLE-GPU TEST: DeepSpeed (Training) + vLLM (Inference)
# ==============================================================================
# Qwen2.5-0.5B-Instruct on 1 GPU, FrozenLake environment.
# actor_train: DeepSpeed ZeRO-2
# actor_infer: vLLM
# reference:   HuggingFace infer
# All roles share GPU 0.
# ==============================================================================
defaults:
  - ../config/traj_envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_
  - ../config/deepspeed_zero2_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "single_gpu_ds_vllm"
seed: 42
timestamp: ${oc.env:TRAINING_TIMESTAMP,${now:%Y%m%d_%H%M%S}}
base_output_dir: ./output
logging_dir: ${base_output_dir}/${timestamp}/logs
output_dir: ${base_output_dir}/${timestamp}
render_save_dir: ${base_output_dir}/${timestamp}/render

track_with: wandb
tracker_kwargs:
  project: roll-agentic-single-gpu-test
  name: ${timestamp}_${exp_name}
  notes: "Single GPU test: DeepSpeed ZeRO-2 + vLLM"
  tags: [agentic, roll, frozen_lake, single_gpu, deepspeed, vllm]
  mode: offline
  dir: ${base_output_dir}/${timestamp}/wandb

checkpoint_config:
  type: file_system
  output_dir: ${base_output_dir}/${timestamp}/models/${exp_name}

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================

num_gpus_per_node: 1

max_steps: 50
save_steps: 10000
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 16
val_batch_size: 16
sequence_length: 4096

advantage_clip: 0.2
ppo_epochs: 1
adv_estimator: "grpo"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================

pretrain: /mnt/project_modelware_roce/zhaojian/models/pretrain/Qwen2.5-0.5B-Instruct/Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: /mnt/project_modelware_roce/zhaojian/models/pretrain/Qwen2.5-0.5B-Instruct/Qwen/Qwen2.5-0.5B-Instruct

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 10
    lr_scheduler_type: cosine
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: deepspeed_train
    strategy_config: ${deepspeed_zero2}
  device_mapping: list(range(0,1))
  infer_batch_size: 1

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 32
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      load_format: auto
  device_mapping: list(range(0,1))
  infer_batch_size: 1

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,1))
  infer_batch_size: 1

# =============================================================================
# ENVIRONMENT CONFIGURATION
# =============================================================================

reward_normalization:
  grouping: tags
  method: identity

train_env_manager:
  format_penalty: -0.15
  max_env_num_per_worker: 16
  num_env_groups: 16
  group_size: 1
  tags: [FrozenLake]
  num_groups_partition: [16]

val_env_manager:
  max_env_num_per_worker: 1
  num_env_groups: 2
  group_size: 1
  tags: [FrozenLake]
  num_groups_partition: [2]

max_tokens_per_step: 64

custom_envs:
  FrozenLake:
    ${custom_env.FrozenLake}
