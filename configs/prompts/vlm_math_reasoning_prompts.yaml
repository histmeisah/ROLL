# ============================================================================
# Category Descriptions
# ============================================================================
categories:
  r1_style:
    name: "R1-Style Standard"
    description: "Standard VLM reasoning prompts from VLM-R1/Vision-R1 community"
    key_papers:
      - "VLM-R1 (om-ai-lab, 2025)"
      - "Vision-R1 (Osilly, 2025)"

  describe_then_solve:
    name: "Describe-then-Solve"
    description: "First describe visual content, then solve. Reduces visual hallucination."
    key_papers:
      - "LLaVA-CoT (PKU, ICCV 2025)"
      - "DVLR (ICCV 2025)"

  geometry:
    name: "Geometry-Specific"
    description: "Specialized prompts for geometric reasoning with structured extraction"
    key_papers:
      - "DVLR - Decoupled Visual-Linguistic Reasoning (ICCV 2025)"
      - "GeoCoder (2025)"

  chain_of_thought:
    name: "Chain-of-Thought (VLM-adapted)"
    description: "Classic CoT prompts adapted for multimodal context"
    key_papers:
      - "Kojima et al., 2022 (adapted for VLM)"
      - "Zhou et al., 2022 APE (adapted for VLM)"

  plan_and_solve:
    name: "Plan-and-Solve (VLM-adapted)"
    description: "Two-stage prompts adapted for visual problem solving"
    key_papers:
      - "Wang et al., 2023 PS+ (adapted for VLM)"

  verification:
    name: "Verification and Self-Checking"
    description: "Prompts that encourage verifying answers against visual information"
    key_papers:
      - "VL-Rethinker (TIGER-AI-Lab, NeurIPS 2025)"

  cross_modal:
    name: "Cross-Modal Formalization"
    description: "Translate visual content to formal representations before reasoning"
    key_papers:
      - "R1-Onevision (ICCV 2025)"
      - "CCoT - Compositional Chain-of-Thought (CVPR 2024)"

  structured:
    name: "Structured Format"
    description: "Prompts with explicit output structure for consistent formatting"

  direct:
    name: "Direct/Baseline"
    description: "Minimal prompts without reasoning scaffolding for ablation baseline"
